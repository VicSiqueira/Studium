<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171416">
<title>OfensivaMED — Studium</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=EB+Garamond:wght@400;500;600&family=Libre+Baskerville:wght@400;700&display=swap');
:root{
 --bg:#171416;--panel:#211b1d;--panel2:#2a2023;--ink:#f0e4d0;--muted:#ad9c91;
 --gold:#c5a46d;--gold2:#e0c68e;--wine:#7f253d;--wine2:#a83a58;
 --green:#294b3d;--green2:#3f6b55;--line:#4b3a3b;--cream:#efe2c9;
}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 80% 0%,#332126 0,#171416 40%);color:var(--ink);font-family:"EB Garamond",serif;font-size:16px}
button,input,select,textarea{font:inherit} button{cursor:pointer}
.app{display:flex;min-height:100vh}.side{width:250px;border-right:1px solid var(--line);padding:28px 18px;position:fixed;inset:0 auto 0 0;background:rgba(23,20,22,.96);z-index:5}
.brand{padding:4px 10px 28px;border-bottom:1px solid var(--line);margin-bottom:18px}.brand small{font-family:"Libre Baskerville";letter-spacing:.18em;color:var(--gold);font-size:9px}.brand h1{font:700 31px "Cormorant Garamond";margin:5px 0 0}.brand p{color:var(--muted);margin:0;font-style:italic}
nav button{width:100%;text-align:left;background:none;border:0;color:var(--muted);padding:12px 12px;border-radius:8px;margin:2px 0;letter-spacing:.02em}nav button:hover,nav button.active{background:#2b2023;color:var(--cream);box-shadow:inset 2px 0 var(--gold)}
.navicon{display:inline-block;width:27px;color:var(--gold)}
.main{margin-left:250px;width:calc(100% - 250px);max-width:1400px;padding:34px 42px 70px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:26px}.eyebrow{text-transform:uppercase;letter-spacing:.22em;color:var(--gold);font:10px "Libre Baskerville"}.title{font:700 42px "Cormorant Garamond";margin:5px 0}.subtitle{color:var(--muted);font-style:italic}.date{color:var(--gold2);font-size:15px}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.card{background:linear-gradient(145deg,rgba(43,32,35,.94),rgba(31,25,28,.94));border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:0 12px 30px rgba(0,0,0,.16)}.card h3{font:600 23px "Cormorant Garamond";margin:0 0 10px}.metric{font:700 30px "Cormorant Garamond";color:var(--cream)}.label{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}.gold{color:var(--gold2)}.wine{color:#cf7189}.green{color:#9fc8ae}
.progress{height:7px;background:#3a3031;border-radius:99px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--wine),var(--gold));border-radius:99px}
.section{margin-top:28px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sectionhead h2{font:600 29px "Cormorant Garamond";margin:0}.btn{border:1px solid #70585b;background:#2b2023;color:var(--cream);padding:9px 13px;border-radius:7px}.btn:hover{border-color:var(--gold);color:white}.btn.primary{background:var(--wine);border-color:#9c3c57}.btn.green{background:var(--green);border-color:#517b66}
.task{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #3b3032}.task:last-child{border-bottom:0}.check{width:20px;height:20px;border:1px solid #806d69;border-radius:5px;display:grid;place-items:center;flex:none}.check.done{background:var(--green2);border-color:var(--green2);color:white}.task.done .taskname{text-decoration:line-through;color:#82756f}.grow{flex:1}.tag{font-size:11px;padding:3px 7px;border-radius:99px;border:1px solid #6b5356;color:#c8b6a7}.high{border-color:#8c4054;color:#e2a0b0}.medium{border-color:#8a754b;color:#ddc38d}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #3b3032}th{color:var(--gold);font:11px "Libre Baskerville";text-transform:uppercase;letter-spacing:.06em}td{color:#d8c9b9}.trend{font-size:12px;color:#9fc8ae}
input,select,textarea{background:#181517;color:var(--cream);border:1px solid #574447;border-radius:7px;padding:10px 11px;width:100%;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--gold)}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.form .full{grid-column:1/-1}.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.modalbox{max-width:620px;width:100%;background:#211b1d;border:1px solid var(--gold);border-radius:12px;padding:24px;max-height:90vh;overflow:auto}.modalbox h2{font:700 30px "Cormorant Garamond";margin-top:0}
.kpi{display:flex;justify-content:space-between;gap:15px}.mini{font-size:13px;color:var(--muted)}.barrow{margin:13px 0}.barrow div:first-child{display:flex;justify-content:space-between}.ring{width:90px;height:90px;border-radius:50%;background:conic-gradient(var(--gold) 0 78%,#3b3032 78%);display:grid;place-items:center}.ring:after{content:"";width:68px;height:68px;border-radius:50%;background:#211b1d;position:absolute}.ring span{position:relative;z-index:1;font:700 22px "Cormorant Garamond"}.quote{font:italic 18px "Cormorant Garamond";color:#d8c6b4;border-left:2px solid var(--gold);padding-left:15px}.empty{text-align:center;color:var(--muted);padding:30px}
.mobilebar{display:none}
@media(max-width:900px){.side{display:none}.main{margin-left:0;width:100%;padding:24px 17px 90px}.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#1b1719;border-top:1px solid var(--line);z-index:10;justify-content:space-around;padding:7px}.mobilebar button{background:none;border:0;color:var(--muted);font-size:11px}.mobilebar button.active{color:var(--gold2)}.title{font-size:36px}.form{grid-template-columns:1fr}}
</style>
<style>
/* V6 — notebook, errors, calendar, residency details */
.side{overflow-y:auto;max-height:100vh}
.main{overflow-x:hidden}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.notebook-grid{display:grid;grid-template-columns:240px 1fr;gap:18px;min-height:520px}
.folder-list,.page-list{display:flex;flex-direction:column;gap:8px}
.folder-item,.page-item{border:1px solid var(--line);background:#241c1f;color:var(--cream);padding:11px 12px;border-radius:8px;text-align:left;cursor:pointer}
.folder-item.active,.page-item.active{border-color:var(--gold);background:#302327}
.editor-toolbar{display:flex;gap:6px;flex-wrap:wrap;padding:8px;border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;background:#2a2023}
.editor-toolbar button{min-width:36px;padding:6px 9px;border:1px solid #5e484b;background:#211b1d;color:var(--cream);border-radius:6px}
.editor{min-height:360px;border:1px solid var(--line);border-radius:0 0 8px 8px;padding:16px;background:#181517;outline:none;line-height:1.65}
.editor:focus{border-color:var(--gold)}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:770px}
.calhead,.calday{padding:10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.calhead{background:#2a2023;color:var(--gold);font-size:12px;text-transform:uppercase}
.calday{min-height:105px;background:#1f191b;vertical-align:top}
.calday.today{box-shadow:inset 0 0 0 1px var(--gold)}
.calnum{font-weight:bold}
.event{font-size:11px;margin-top:6px;padding:4px 5px;border-radius:5px;background:#4b2933;color:#efd9d0}
.event.exam{background:#294b3d}.event.deadline{background:#5b4930}
.timeline{border-left:2px solid var(--gold);padding-left:18px}
.timeline-item{position:relative;margin:0 0 18px}.timeline-item:before{content:"";position:absolute;left:-25px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--gold)}
@media(max-width:700px){.notebook-grid{grid-template-columns:1fr}.calendar{min-width:700px}.main{padding-left:14px;padding-right:14px}}
</style>

</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand"><small>STUDIUM · 2026—2027</small><h1>OfensivaMED</h1><p>Seu centro de comando.</p></div>
  <nav id="nav">
    <button data-page="home" class="active"><span class="navicon">⌂</span>Início</button>
    <button data-page="study"><span class="navicon">✦</span>Estudar</button>
    <button data-page="errors"><span class="navicon">⚠</span>Banco de erros</button>
    <button data-page="residency"><span class="navicon">♜</span>Residência</button>
    <button data-page="calendar"><span class="navicon">▦</span>Calendário</button>
    <button data-page="notebook"><span class="navicon">▤</span>Caderno</button>
    <button data-page="progress"><span class="navicon">◌</span>Progresso</button>
    <button data-page="journey"><span class="navicon">↗</span>Minha jornada</button>
    <button data-page="rewards"><span class="navicon">◇</span>Cofre</button>
    <button data-page="journal"><span class="navicon">✎</span>Diário</button>
    <button data-page="settings"><span class="navicon">⚙</span>Mais</button>
  </nav>
</aside>
<main class="main" id="app"></main>
</div>
<div class="mobilebar" id="mobilebar"></div>

<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div>

<script>
const KEY="studium_v6";
const defaultData={
  schemaVersion:6,streak:0,tokens:0,goal:4,weekHours:0,totalQuestions:0,overallAccuracy:0,
  tasks:[],subjects:[],exams:[],rewards:[
    {name:"Café especial",cost:40,claimed:false},
    {name:"Um capítulo de livro",cost:60,claimed:false},
    {name:"Filme sem culpa",cost:180,claimed:false},
    {name:"Livro novo",cost:500,claimed:false}
  ],journal:[],errors:[],folders:[],notebooks:[],notes:[],events:[]
};
let data=JSON.parse(localStorage.getItem(KEY)||"null");
if(!data || data.schemaVersion!==6){data=structuredClone(defaultData);localStorage.removeItem(KEY)}
data.tasks=data.tasks||[];data.subjects=data.subjects||[];data.exams=data.exams||[];data.journal=data.journal||[];data.errors=data.errors||[];
data.folders=data.folders||[];data.notebooks=data.notebooks||[];data.notes=data.notes||[];data.events=data.events||[];
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function today(){return new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"})}
function pageTitle(k){return ({home:"Centro de comando",study:"Estudar",residency:"Residência",progress:"Seu progresso",rewards:"Cofre de recompensas",journal:"Diário de campanha",settings:"Mais"})[k]}
function render(page="home"){
 document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
 const app=document.getElementById("app");
 const titles={home:"Centro de comando",study:"Estudar",errors:"Banco de erros",residency:"Residência",calendar:"Calendário",notebook:"Caderno",progress:"Progresso",journey:"Minha jornada",rewards:"Cofre",journal:"Diário",settings:"Mais"};
 const head=`<div class="top"><div><div class="eyebrow">STUDIUM · 2026—2027</div><div class="title">${titles[page]||"Studium"}</div><div class="subtitle">${page==="journal"?"Diário para minha residência · Foca. Você vai conseguir virar uma neurologista.":"Acompanhe sua campanha, um passo de cada vez."}</div></div><div class="date">${today()}</div></div>`;
 let body="";
 if(page==="home")body=home(); if(page==="study")body=study(); if(page==="errors")body=errorsPage();
 if(page==="residency")body=residency(); if(page==="calendar")body=calendarPage(); if(page==="notebook")body=notebookPage();
 if(page==="progress")body=progress(); if(page==="journey")body=journeyPage(); if(page==="rewards")body=rewards(); if(page==="journal")body=journal(); if(page==="settings")body=settings();
 app.innerHTML=head+body; bind(); window.scrollTo({top:0,behavior:"instant"});
}
function home(){
 const done=data.tasks.filter(t=>t.done).length, pct=data.tasks.length?Math.round(done/data.tasks.length*100):0;
 const upcoming=[...data.exams].filter(e=>e.date).sort((a,b)=>new Date(a.date)-new Date(b.date))[0];
 const weak=data.subjects.slice().sort((a,b)=>a.accuracy-b.accuracy).slice(0,3);
 const tasks=data.tasks.map(t=>`<div class="task ${t.done?"done":""}" data-task="${t.id}"><button class="check ${t.done?"done":""}">${t.done?"✓":""}</button><div class="grow"><div class="taskname">${esc(t.name)}</div><div class="mini">${esc(t.meta)}</div></div><span class="tag ${t.tag==="alta"?"high":t.tag==="média"?"medium":""}">${t.tag}</span></div>`).join("");
 return `<div class="grid g4">
 <div class="card"><div class="label">Ofensiva</div><div class="metric">${data.streak} dias</div><div class="progress"><i style="width:${Math.min(100,data.streak/30*100)}%"></i></div></div>
 <div class="card"><div class="label">Tokens</div><div class="metric gold">${data.tokens} ◆</div><div class="mini">recompensas disponíveis no Cofre</div></div>
 <div class="card"><div class="label">Semana</div><div class="metric">${data.weekHours} h</div><div class="mini">meta diária: ${data.goal} h</div></div>
 <div class="card"><div class="label">Questões</div><div class="metric">${data.totalQuestions.toLocaleString("pt-BR")}</div><div class="mini">${data.overallAccuracy}% de acerto geral</div></div>
 </div>
 <div class="section grid g2">
  <div class="card"><div class="sectionhead"><h2>Plano de hoje</h2><button class="btn" data-action="addtask">+ tarefa</button></div>${tasks||`<div class="empty">Seu plano começa aqui. Adicione a primeira tarefa.</div>`}<div class="progress"><i style="width:${pct}%"></i></div><div class="mini">${done}/${data.tasks.length} tarefas concluídas</div></div>
  <div class="card"><h2>Próxima residência</h2>${upcoming?`<h3>${esc(upcoming.name)}</h3><div class="mini">Prova: ${esc(upcoming.date)}</div>`:`<div class="empty">Cadastre um processo seletivo para acompanhar seus próximos prazos.</div>`}<br><button class="btn primary" data-page="residency">Abrir residência</button></div>
 </div>
 <div class="section grid g2">
  <div class="card"><h2>Onde vale olhar</h2>${weak.length?weak.map(s=>`<div class="barrow"><div><span>${esc(s.name)}</span><b>${s.accuracy}%</b></div><div class="progress"><i style="width:${s.accuracy}%"></i></div></div>`).join(""):`<div class="empty">Quando você cadastrar seus temas, esta área será preenchida pelos seus próprios dados.</div>`}</div>
  <div class="card"><h2>Frase do dia</h2><p class="quote">“O bom médico continua sendo estudante.”</p><div class="mini">A preparação é construída em pequenos dias como este.</div></div>
 </div>`;
}
function study(){
 return `<div class="grid g3">
 <div class="card"><h3>Plano semanal</h3><div class="label">Meta</div><div class="metric">${data.goal} h/dia</div><div class="progress"><i style="width:${Math.min(100,data.weekHours/(data.goal*7||1)*100)}%"></i></div><div class="mini">${data.weekHours} h acumuladas nesta semana</div><br><button class="btn primary" data-action="editgoal">Ajustar meta</button></div>
 <div class="card"><h3>Registrar questões</h3><div class="metric">${data.totalQuestions}</div><div class="mini">questões registradas</div><br><button class="btn primary" data-action="addquestions">+ registrar bloco</button></div>
 <div class="card"><h3>Banco de erros</h3><div class="metric wine">${data.errors.length}</div><div class="mini">erros para revisar</div><br><button class="btn" data-page="errors">Abrir banco de erros</button></div>
 </div>
 <div class="section card"><div class="sectionhead"><h2>Mapa de temas</h2><button class="btn" data-action="addsubject">+ tema</button></div><div class="scrollx"><table><thead><tr><th>Tema</th><th>Área</th><th>Acerto</th><th>Questões</th><th>Prioridade</th><th>Próxima revisão</th></tr></thead><tbody>
 ${data.subjects.length?data.subjects.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.area)}</td><td class="${s.accuracy<70?"wine":"green"}">${s.accuracy}%</td><td>${s.questions}</td><td><span class="tag">${s.priority}</span></td><td>${esc(s.review||"A definir")}</td></tr>`).join(""):`<tr><td colspan="6" class="empty">Nenhum tema cadastrado.</td></tr>`}</tbody></table></div></div>`;
}
function residency(){
 return `<div class="sectionhead"><div><h2>Processos seletivos</h2><div class="mini">Cadastre cada etapa separadamente para que o calendário e os alertas façam sentido.</div></div><button class="btn primary" data-action="addexam">+ cadastrar residência</button></div>
 ${data.exams.length?`<div class="grid g2">${data.exams.map((e,i)=>`<div class="card"><div class="sectionhead"><h2>${esc(e.name||"Processo sem nome")}</h2><span class="tag">${esc(e.status||"Acompanhando")}</span></div><div class="label">${esc(e.year||"Ano não informado")}</div>
 <div class="grid g3" style="margin-top:15px"><div><div class="metric">${esc(e.vacancies||"—")}</div><div class="mini">vagas</div></div><div><div class="metric">${esc(e.candidates||"—")}</div><div class="mini">candidatos/vaga</div></div><div><div class="metric gold">${esc(e.cut||"—")}</div><div class="mini">corte de referência</div></div></div>
 <hr style="border:0;border-top:1px solid #3b3032;margin:18px 0">
 <div class="kpi"><span>📜 Edital<br><b>${esc(e.edital||"não informado")}</b></span><span>📝 Inscrições<br><b>${esc(e.insStart||"—")} → ${esc(e.insEnd||"—")}</b></span></div><br>
 <div class="kpi"><span>🏛️ Prova<br><b>${esc(e.date||"não informada")}</b></span><span>📊 Resultado<br><b>${esc(e.result||"—")}</b></span></div>
 <div class="mini" style="margin-top:14px">Taxa: ${esc(e.fee||"—")} · Banca: ${esc(e.board||"—")}</div>
 <br><button class="btn" data-action="editexam" data-i="${i}">Editar</button> <button class="btn" data-action="deleteexam" data-i="${i}">Excluir</button> ${e.url?`<a class="btn" href="${esc(e.url)}" target="_blank" rel="noopener">Edital ↗</a>`:""} ${e.site?`<a class="btn" href="${esc(e.site)}" target="_blank" rel="noopener">Site ↗</a>`:""}</div>`).join("")}</div>`:`<div class="card empty"><h2>Sua central de residência começa aqui</h2><p>Cadastre uma prova e informe separadamente edital, inscrição, prova e resultado.</p><button class="btn primary" data-action="addexam">+ cadastrar primeira residência</button></div>`}
 <div class="section card"><h2>Como preencher</h2><div class="grid g2"><div><b>📜 Edital publicado</b><div class="mini">Dia em que o edital oficial foi divulgado.</div><br><b>📝 Início/fim das inscrições</b><div class="mini">Janela em que a candidatura pode ser realizada.</div></div><div><b>🏛️ Data da prova</b><div class="mini">Dia da prova objetiva/processo indicado.</div><br><b>📊 Resultado</b><div class="mini">Data prevista/oficial de divulgação do resultado.</div></div></div></div>`;
}
function progress(){
 const total=data.subjects.reduce((a,s)=>a+(Number(s.questions)||0),0), weighted=total?Math.round(data.subjects.reduce((a,s)=>a+(Number(s.questions)||0)*(Number(s.accuracy)||0),0)/total):0;
 return `<div class="grid g4"><div class="card"><div class="label">Acerto por temas</div><div class="metric">${weighted}%</div><div class="trend">${data.subjects.length?"calculado dos seus temas":"aguardando registros"}</div></div><div class="card"><div class="label">Questões</div><div class="metric">${total.toLocaleString("pt-BR")}</div><div class="trend">${data.subjects.length?"registradas nos temas":"comece a registrar"}</div></div><div class="card"><div class="label">Erros</div><div class="metric">${data.errors.length}</div><div class="trend">no banco de erros</div></div><div class="card"><div class="label">Sessões</div><div class="metric">${data.journal.length}</div><div class="trend">registradas no diário</div></div></div>
 <div class="section grid g2"><div class="card"><h2>Áreas que pedem atenção</h2>${data.subjects.length?data.subjects.slice().sort((a,b)=>a.accuracy-b.accuracy).map(s=>`<div class="barrow"><div><span>${esc(s.name)}</span><b>${s.accuracy}%</b></div><div class="progress"><i style="width:${Math.min(100,s.accuracy)}%"></i></div></div>`).join(""):`<div class="empty">Seus indicadores aparecerão quando você registrar temas e questões.</div>`}</div>
 <div class="card"><h2>Histórico de notas de corte</h2>${data.exams.length?data.exams.map(e=>`<div class="sectionhead"><span>${esc(e.name)}</span><b>${esc(e.cut||"—")}</b></div>`).join(""):`<div class="empty">Cadastre residências para acompanhar referências de corte.</div>`}</div></div>`;
}

function errorsPage(){
 return `<div class="sectionhead"><div><h2>Banco de erros</h2><div class="mini">Registre por que você errou e transforme o erro em revisão.</div></div><button class="btn primary" data-action="adderror">+ novo erro</button></div>
 ${data.errors.length?`<div class="grid g2">${data.errors.map((e,i)=>`<div class="card"><div class="sectionhead"><span class="tag">${esc(e.reason)}</span><button class="btn" data-action="deleteerror" data-i="${i}">Excluir</button></div><h3>${esc(e.topic)}</h3><div class="mini">${esc(e.area)} · revisar ${esc(e.review||"a definir")}</div><p>${esc(e.remember||"")}</p></div>`).join("")}</div>`:`<div class="card empty"><h2>Nenhum erro registrado</h2><p>Isso é proposital. O banco começa vazio.</p></div>`}`;
}
function calendarPage(){
 const now=new Date(); const y=now.getFullYear(),m=now.getMonth(); const first=new Date(y,m,1).getDay(); const days=new Date(y,m+1,0).getDate();
 const names=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"]; let cells=names.map(n=>`<div class="calhead">${n}</div>`).join("");
 for(let i=0;i<first;i++)cells+=`<div class="calday"></div>`;
 for(let d=1;d<=days;d++){const key=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;const ev=data.events.filter(x=>x.date===key);data.exams.forEach(e=>{
   [["edital","Edital"],["insStart","Início inscrições"],["insEnd","Fim inscrições"],["date","Prova"],["result","Resultado"]].forEach(([field,label])=>{
    if(e[field]&&e[field]===key)ev.push({label:`${label} · ${e.name}`,type:field==="date"?"exam":"deadline"});
   });
 });cells+=`<div class="calday ${d===now.getDate()?"today":""}"><div class="calnum">${d}</div>${ev.map(e=>`<div class="event ${e.type||""}">${esc(e.label)}</div>`).join("")}</div>`}
 return `<div class="sectionhead"><div><h2>${now.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})}</h2><div class="mini">Datas cadastradas nas residências aparecem aqui automaticamente.</div></div><button class="btn primary" data-action="addevent">+ evento de estudo</button></div><div class="scrollx"><div class="calendar">${cells}</div></div>
 <div class="section card"><h2>Próximos eventos</h2>${data.events.length?data.events.map((e,i)=>`<div class="task"><div class="grow"><b>${esc(e.label)}</b><div class="mini">${esc(e.date)}</div></div><button class="btn" data-action="deleteevent" data-i="${i}">Excluir</button></div>`).join(""):`<div class="empty">Adicione tarefas de estudo ou cadastre uma residência.</div>`}</div>`;
}
function notebookPage(){
 const f=data.folders[0]||null, n=data.notebooks.find(x=>x.folderId===(f&&f.id))||null, note=data.notes.find(x=>x.notebookId===(n&&n.id))||null;
 return `<div class="sectionhead"><div><h2>Seu caderno de anotações</h2><div class="mini">Pastas → cadernos → páginas. Clique em uma página para continuar escrevendo.</div></div><button class="btn primary" data-action="newfolder">+ pasta</button></div>
 <div class="notebook-grid">
  <div class="card"><div class="sectionhead"><h3>Pastas</h3></div><div class="folder-list">${data.folders.map((x,i)=>`<button class="folder-item ${i===0?"active":""}"><b>📁 ${esc(x.name)}</b><div class="mini">${data.notebooks.filter(n=>n.folderId===x.id).length} cadernos</div></button>`).join("")||`<div class="empty">Crie sua primeira pasta.</div>`}</div></div>
  <div class="card">${f?`<div class="sectionhead"><div><h2>${esc(f.name)}</h2><div class="mini">Cadernos dentro desta pasta</div></div><div><button class="btn" data-action="newnotebook" data-i="${f.id}">+ caderno</button> <button class="btn" data-action="deletefolder" data-i="${f.id}">Excluir pasta</button></div></div><div class="grid g3">${data.notebooks.filter(x=>x.folderId===f.id).map(x=>`<div class="card"><h3>▤ ${esc(x.name)}</h3><div class="mini">${data.notes.filter(q=>q.notebookId===x.id).length} páginas</div><br><button class="btn primary" data-action="openbook" data-i="${x.id}">Abrir caderno</button> <button class="btn" data-action="deletenotebook" data-i="${x.id}">Excluir</button></div>`).join("")||`<div class="empty">Esta pasta ainda não tem cadernos.</div>`}</div>`:`<div class="empty"><h2>Comece criando uma pasta</h2><button class="btn primary" data-action="newfolder">+ criar pasta</button></div>`}</div>
 </div>
 ${n?`<div class="section card"><div class="sectionhead"><h2>▤ ${esc(n.name)}</h2><button class="btn primary" data-action="newpage" data-i="${n.id}">+ nova página</button></div><div class="notebook-grid"><div class="page-list">${data.notes.filter(x=>x.notebookId===n.id).map((x,i)=>`<button class="page-item ${i===0?"active":""}" data-action="editpage" data-i="${data.notes.indexOf(x)}">📄 ${esc(x.title)}</button>`).join("")||`<div class="empty">Nenhuma página ainda.</div>`}</div><div><div class="mini">Selecione uma página na coluna ao lado ou crie uma nova.</div>${note?`<h3>${esc(note.title)}</h3><div class="quote">${esc(note.subject||"")}</div><div class="card" style="margin-top:12px">${note.body||"<span class='mini'>Página vazia.</span>"}</div>`:""}</div></div></div>`:""}`;
}
function journeyPage(){
 return `<div class="card"><h2>Minha jornada</h2><div class="timeline"><div class="timeline-item"><b>2026</b><div class="mini">Último ano de Medicina · início da preparação estruturada</div></div><div class="timeline-item"><b>2027</b><div class="mini">Formatura · inscrições · provas de residência</div></div><div class="timeline-item"><b>2028</b><div class="mini">R1 · Neurologia</div></div></div><br><button class="btn primary" data-action="addmilestone">+ adicionar marco</button>${data.events.filter(e=>e.type==="milestone").map(e=>`<div class="task"><div class="grow"><b>${esc(e.label)}</b><div class="mini">${esc(e.date)}</div></div></div>`).join("")}</div>`;
}
function rewards(){
 return `<div class="card"><div class="sectionhead"><div><h2>Seu cofre</h2><div class="mini">${data.tokens} ◆ disponíveis</div></div><button class="btn primary" data-action="addreward">+ recompensa</button></div><div class="grid g3">${data.rewards.map((r,i)=>`<div class="card"><h3>${esc(r.name)}</h3><div class="metric gold">${r.cost} ◆</div><div class="mini">${r.claimed?"Resgatada":"Disponível para você"}</div><br><button class="btn ${data.tokens>=r.cost&&!r.claimed?"green":""}" ${data.tokens<r.cost||r.claimed?"disabled":""} data-action="claim" data-i="${i}">${r.claimed?"Resgatada":"Resgatar"}</button></div>`).join("")}</div></div>`;
}
function journal(){
 return `<div class="sectionhead"><div><h2>Diário para minha residência</h2><div class="quote">Foca. Você vai conseguir virar uma neurologista. Um dia de cada vez.</div></div><button class="btn primary" data-action="journaladd">+ registrar sessão</button></div>
 <div class="grid g2">${data.journal.length?data.journal.map(j=>`<div class="card"><div class="label">${esc(j.date)}</div><h3>${esc(j.focus)}</h3><div class="kpi"><span><b>${esc(j.hours)} h</b><br><span class="mini">estudo</span></span><span><b>${esc(j.questions)}</b><br><span class="mini">questões</span></span><span><b>${esc(j.accuracy)}%</b><br><span class="mini">acerto</span></span></div><p class="mini">${esc(j.note||"")}</p></div>`).join(""):`<div class="card empty">Seu diário começa aqui.</div>`}</div>`;
}
function settings(){
 return `<div class="grid g2"><div class="card"><h2>Dados</h2><p class="mini">Seu progresso é salvo neste navegador usando armazenamento local.</p><button class="btn" data-action="export">Exportar backup JSON</button> <button class="btn" data-action="reset">Restaurar dados de demonstração</button></div><div class="card"><h2>Filosofia</h2><p class="quote">“Não é sobre estudar perfeitamente. É sobre construir, ao longo de meses, uma preparação que você consegue sustentar.”</p><p class="mini">A ofensiva não deve produzir culpa. Ela deve facilitar o retorno.</p></div></div>`;
}
function openModal(content){document.getElementById("modalbox").innerHTML=content;document.getElementById("modal").classList.add("open")}
function closeModal(){document.getElementById("modal").classList.remove("open")}
function bind(){
 document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>render(b.dataset.page));
 document.querySelectorAll("[data-task]").forEach(el=>el.onclick=()=>{const t=data.tasks.find(x=>x.id==el.dataset.task);t.done=!t.done;if(t.done)data.tokens+=10;save();render("home")});
 document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>action(b.dataset.action,b.dataset.i));
 document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>render(b.dataset.page));
}
function action(a,i){
 if(a==="addtask")openModal(`<h2>Nova tarefa</h2><div class="form"><input id="f1" placeholder="Ex.: Clínica — AVC"><input id="f2" placeholder="Meta, ex.: 30 questões"><select id="f3"><option>alta</option><option selected>média</option><option>baixa</option></select></div><br><button class="btn primary" onclick="addTask()">Adicionar</button>`);
 if(a==="addsubject")openModal(`<h2>Novo tema</h2><div class="form"><input id="s1" placeholder="Tema"><input id="s2" placeholder="Área"><input id="s3" type="number" placeholder="% de acerto"><input id="s4" type="number" placeholder="Questões"></div><br><button class="btn primary" onclick="addSubject()">Adicionar</button>`);
 if(a==="addquestions")openModal(`<h2>Registrar bloco de questões</h2><div class="form"><input id="q1" type="number" placeholder="Questões feitas"><input id="q2" type="number" placeholder="Questões certas"><input id="q3" placeholder="Tema"><input id="q4" placeholder="Área"></div><br><button class="btn primary" onclick="addQuestions()">Registrar</button>`);
 if(a==="adderror")openModal(`<h2>Novo erro</h2><div class="form"><input id="er1" placeholder="Tema / questão"><input id="er2" placeholder="Área"><select id="er3"><option>Não sabia</option><option>Esqueci</option><option>Confundi</option><option>Interpretei errado</option><option>Desatenção</option></select><input id="er4" type="date"><textarea id="er5" class="full" placeholder="O que preciso lembrar?"></textarea></div><br><button class="btn primary" onclick="addError()">Salvar erro</button>`);
 if(a==="addexam"||a==="editexam"){const e=a==="editexam"?data.exams[i]:{};openModal(`<h2>${a==="editexam"?"Editar processo seletivo":"Cadastrar residência"}</h2><div class="mini">Preencha as datas separadamente. Elas também alimentarão o Calendário.</div><br><div class="form">
 <input id="e1" placeholder="Instituição + especialidade" value="${esc(e.name||"")}"><input id="e2" placeholder="Ano do processo (ex.: 2027)" value="${esc(e.year||"2027")}">
 <label>📜 Edital publicado<input id="e3" type="date" value="${esc(e.edital||"")}"></label><label>📝 Início das inscrições<input id="e4" type="date" value="${esc(e.insStart||"")}"></label>
 <label>📝 Fim das inscrições<input id="e5" type="date" value="${esc(e.insEnd||"")}"></label><label>🏛️ Data da prova<input id="e6" type="date" value="${esc(e.date||"")}"></label>
 <label>📊 Resultado previsto<input id="e7" type="date" value="${esc(e.result||"")}"></label><input id="e8" placeholder="Vagas" value="${esc(e.vacancies||"")}">
 <input id="e9" placeholder="Candidatos/vaga" value="${esc(e.candidates||"")}"><input id="e10" placeholder="Nota de corte de referência" value="${esc(e.cut||"")}">
 <input id="e11" placeholder="Taxa de inscrição (ex.: R$ 500)" value="${esc(e.fee||"")}"><input id="e12" placeholder="Banca organizadora" value="${esc(e.board||"")}">
 <input id="e13" placeholder="Link do edital (https://...)" value="${esc(e.url||"")}"><input id="e14" placeholder="Site oficial do processo" value="${esc(e.site||"")}">
 <select id="e15"><option>Acompanhando</option><option>Monitorando</option><option>Inscrição aberta</option><option>Inscrição encerrada</option><option>Prova realizada</option></select>
 </div><br><button class="btn primary" onclick="addExam(${a==="editexam"?i:"null"})">Salvar residência</button>`)}
 if(a==="deleteexam"){if(confirm("Excluir este processo seletivo?")){data.exams.splice(Number(i),1);save();render("residency")}}
 if(a==="addfolder")openModal(`<h2>Nova pasta</h2><input id="fd1" placeholder="Ex.: Clínica Médica"><br><br><button class="btn primary" onclick="addFolder()">Criar pasta</button>`);
 if(a==="newfolder")action("addfolder");
 if(a==="newnotebook"){openModal(`<h2>Novo caderno</h2><input id="nb1" placeholder="Ex.: Cardiologia"><br><br><button class="btn primary" onclick="addNotebook(${i})">Criar caderno</button>`)}
 if(a==="deletenotebook"){if(confirm("Excluir este caderno e todas as suas páginas?")){const id=data.notebooks[i]?.id;data.notebooks.splice(i,1);data.notes=data.notes.filter(n=>n.notebookId!==id);save();render("notebook")}}
 if(a==="deletefolder"){if(confirm("Excluir esta pasta, seus cadernos e páginas?")){const fid=i;const ids=data.notebooks.filter(n=>n.folderId===fid).map(n=>n.id);data.folders=data.folders.filter(f=>f.id!==fid);data.notebooks=data.notebooks.filter(n=>n.folderId!==fid);data.notes=data.notes.filter(n=>!ids.includes(n.notebookId));save();render("notebook")}}
 if(a==="newpage"){openModal(`<h2>Nova página</h2><div class="form"><input id="pg1" placeholder="Título"><input id="pg2" placeholder="Tema / subtítulo"></div><br><div class="editor-toolbar"><button onclick="fmt('bold')"><b>B</b></button><button onclick="fmt('italic')"><i>I</i></button><button onclick="fmt('underline')"><u>U</u></button><button onclick="fmt('insertUnorderedList')">• lista</button><button onclick="fmt('insertOrderedList')">1. lista</button><button onclick="fmt('formatBlock','h3')">Título</button></div><div id="pg3" class="editor" contenteditable="true"></div><br><button class="btn primary" onclick="addPage(${i})">Salvar página</button>`)}
 if(a==="editpage"){const n=data.notes[i];openModal(`<h2>Editar página</h2><div class="form"><input id="ep1" value="${esc(n.title)}"><input id="ep2" value="${esc(n.subject||"")}"></div><br><div class="editor-toolbar"><button onclick="fmt('bold')"><b>B</b></button><button onclick="fmt('italic')"><i>I</i></button><button onclick="fmt('underline')"><u>U</u></button><button onclick="fmt('insertUnorderedList')">• lista</button><button onclick="fmt('insertOrderedList')">1. lista</button></div><div id="ep3" class="editor" contenteditable="true">${n.body||""}</div><br><button class="btn primary" onclick="savePage(${i})">Salvar página</button>`)}
 if(a==="addevent")openModal(`<h2>Evento de estudo</h2><input id="ev1" type="date"><input id="ev2" placeholder="Ex.: Revisão de AVC"><br><br><button class="btn primary" onclick="addEvent()">Adicionar</button>`);
 if(a==="deleteerror"){deleteError(Number(i))}
 if(a==="deleteevent"){data.events.splice(Number(i),1);save();render("calendar")}
 if(a==="addmilestone")openModal(`<h2>Novo marco</h2><input id="ms1" type="date"><input id="ms2" placeholder="Ex.: Defesa do TCC"><br><br><button class="btn primary" onclick="addMilestone()">Adicionar</button>`);
 if(a==="addreward")openModal(`<h2>Nova recompensa</h2><div class="form"><input id="r1" placeholder="Ex.: Café especial"><input id="r2" type="number" placeholder="Custo em tokens"></div><br><button class="btn primary" onclick="addReward()">Adicionar</button>`);
 if(a==="claim"){const r=data.rewards[i];if(data.tokens>=r.cost&&!r.claimed){data.tokens-=r.cost;r.claimed=true;save();render("rewards")}}
 if(a==="journaladd")openModal(`<h2>Registrar sessão</h2><div class="form"><input id="j1" placeholder="Foco da sessão"><input id="j2" type="number" step=".1" placeholder="Horas"><input id="j3" type="number" placeholder="Questões"><input id="j4" type="number" placeholder="% de acerto"><textarea id="j5" class="full" placeholder="Como foi?"></textarea></div><br><button class="btn primary" onclick="addJournal()">Registrar</button>`);
 if(a==="editgoal")openModal(`<h2>Meta diária</h2><input id="g1" type="number" step=".5" value="${data.goal}"><br><br><button class="btn primary" onclick="data.goal=Number(document.getElementById('g1').value)||4;save();closeModal();render('study')">Salvar</button>`);
 if(a==="session"){data.tokens+=10;save();openModal(`<h2>Sessão iniciada</h2><div class="metric gold">25:00</div><p class="mini">Ao iniciar, você ganha 10 tokens de teste.</p><button class="btn primary" onclick="closeModal()">Continuar</button>`)}
 if(a==="export"){const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const x=document.createElement("a");x.href=url;x.download="studium-backup.json";x.click();URL.revokeObjectURL(url)}
 if(a==="reset"){if(confirm("Isso apagará os registros deste navegador e começará uma nova preparação. Continuar?")){data=structuredClone(defaultData);save();render("home")}}
}
function fmt(cmd,arg){document.execCommand(cmd,false,arg||null);document.getElementById("pg3")?.focus();document.getElementById("ep3")?.focus()}
function addTask(){data.tasks.push({id:Date.now(),name:document.getElementById("f1").value||"Nova tarefa",meta:document.getElementById("f2").value||"Sessão",tag:document.getElementById("f3").value,done:false});save();closeModal();render("home")}
function addSubject(){data.subjects.push({name:document.getElementById("s1").value||"Novo tema",area:document.getElementById("s2").value||"—",accuracy:Number(document.getElementById("s3").value)||0,questions:Number(document.getElementById("s4").value)||0,priority:"Média",review:"A definir"});save();closeModal();render("study")}
function addQuestions(){const q=Number(document.getElementById("q1").value)||0,c=Number(document.getElementById("q2").value)||0,topic=document.getElementById("q3").value||"Geral",area=document.getElementById("q4").value||"—";let s=data.subjects.find(x=>x.name.toLowerCase()===topic.toLowerCase());if(!s){s={name:topic,area,accuracy:q?Math.round(c/q*100):0,questions:q,priority:"Média",review:"A definir"};data.subjects.push(s)}else{s.accuracy=s.questions+q?Math.round((s.accuracy*s.questions+c)/(s.questions+q)):s.accuracy;s.questions+=q}data.totalQuestions=(data.totalQuestions||0)+q;data.overallAccuracy=data.subjects.length?Math.round(data.subjects.reduce((a,x)=>a+x.accuracy,0)/data.subjects.length):0;data.tokens+=Math.min(20,q);save();closeModal();render("study")}
function addError(){data.errors.unshift({id:Date.now(),topic:document.getElementById("er1").value||"Erro",area:document.getElementById("er2").value||"—",reason:document.getElementById("er3").value,review:document.getElementById("er4").value,remember:document.getElementById("er5").value});save();closeModal();render("errors")}
function deleteError(i){data.errors.splice(i,1);save();render("errors")}
function addExam(i){const e={name:document.getElementById("e1").value||"Processo seletivo",year:document.getElementById("e2").value||"2027",edital:document.getElementById("e3").value,insStart:document.getElementById("e4").value,insEnd:document.getElementById("e5").value,date:document.getElementById("e6").value,result:document.getElementById("e7").value,vacancies:document.getElementById("e8").value,candidates:document.getElementById("e9").value,cut:document.getElementById("e10").value,fee:document.getElementById("e11").value,board:document.getElementById("e12").value,url:document.getElementById("e13").value,site:document.getElementById("e14").value,status:document.getElementById("e15").value};if(i==="null")data.exams.push(e);else data.exams[i]=e;save();closeModal();render("residency")}
function addFolder(){data.folders.push({id:Date.now(),name:document.getElementById("fd1").value||"Nova pasta"});save();closeModal();render("notebook")}
function addNotebook(folderId){data.notebooks.push({id:Date.now(),folderId,name:document.getElementById("nb1").value||"Novo caderno"});save();closeModal();render("notebook")}
function addPage(notebookId){data.notes.unshift({id:Date.now(),notebookId,title:document.getElementById("pg1").value||"Sem título",subject:document.getElementById("pg2").value||"",body:document.getElementById("pg3").innerHTML||"",updated:new Date().toLocaleDateString("pt-BR")});save();closeModal();render("notebook")}
function savePage(i){data.notes[i].title=document.getElementById("ep1").value||"Sem título";data.notes[i].subject=document.getElementById("ep2").value||"";data.notes[i].body=document.getElementById("ep3").innerHTML||"";data.notes[i].updated=new Date().toLocaleDateString("pt-BR");save();closeModal();render("notebook")}
function addEvent(){data.events.push({id:Date.now(),date:document.getElementById("ev1").value,label:document.getElementById("ev2").value||"Estudo"});save();closeModal();render("calendar")}
function addMilestone(){data.events.push({id:Date.now(),date:document.getElementById("ms1").value,label:document.getElementById("ms2").value||"Novo marco",type:"milestone"});save();closeModal();render("journey")}
function addReward(){data.rewards.push({name:document.getElementById("r1").value,cost:Number(document.getElementById("r2").value)||0,claimed:false});save();closeModal();render("rewards")}
function addJournal(){data.journal.unshift({date:new Date().toLocaleDateString("pt-BR"),focus:document.getElementById("j1").value||"Sessão de estudo",hours:Number(document.getElementById("j2").value)||0,questions:Number(document.getElementById("j3").value)||0,accuracy:Number(document.getElementById("j4").value)||0,note:document.getElementById("j5").value});data.weekHours+=Number(document.getElementById("j2").value)||0;data.tokens+=25;save();closeModal();render("journal")}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
render("home");
</script>
</body>
